name: Build and release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag (update resource metadata and release notes for a new version)
        default: v0.4.3
        required: true
        type: string
      sign:
        description: Sign with Azure Artifact Signing (requires configured Azure identity and repository variables)
        default: false
        type: boolean
      publish_release:
        description: Publish signed EXE, installer, checksums, and notices as a new GitHub release
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: official-release
  cancel-in-progress: false
jobs:
  windows:
    # Azure independently checks the immutable repository/main OIDC subject.
    if: github.repository_id == '1449827212' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      GOFLAGS: -buildvcs=false
      RELEASE_TAG: ${{ inputs.release_tag }}
      SIGN_BUILD: ${{ inputs.sign }}
      PUBLISH_RELEASE: ${{ inputs.publish_release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate release settings
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Expected a version such as v0.2.0' }
          if (($env:SIGN_BUILD -eq 'true' -or $env:PUBLISH_RELEASE -eq 'true') -and $env:GITHUB_REF -ne 'refs/heads/main') { throw 'Signing and publishing must run from main' }
          if ($env:PUBLISH_RELEASE -eq 'true' -and $env:SIGN_BUILD -ne 'true') { throw 'Official release publication requires signing' }
          $version = ($env:RELEASE_TAG.Substring(1) + '.0')
          $resources = Get-Content winres/winres.json -Raw | ConvertFrom-Json
          if ($resources.RT_VERSION.'#1'.'0000'.fixed.file_version -ne $version) { throw 'Update resource version before building a new version' }
          if (-not (Test-Path "docs/release-$env:RELEASE_TAG.txt")) { throw 'Missing release notes' }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Verify dependencies and test Windows app
        shell: pwsh
        run: |
          go mod download
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -v ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build portable Windows executable
        shell: pwsh
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o build/Church-TV-Control.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Azure signing configuration
        if: inputs.sign
        shell: pwsh
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
        run: |
          foreach ($key in @('CLIENT','TENANT','SUBSCRIPTION','ENDPOINT','ACCOUNT','PROFILE')) {
            if (-not [Environment]::GetEnvironmentVariable($key)) { throw "Missing Azure configuration: $key" }
          }
      - name: Azure login with GitHub OIDC
        if: inputs.sign
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign executable
        if: inputs.sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\build
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signature
        if: inputs.sign
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature build/Church-TV-Control.exe
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($signature.Status)" }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"
      - name: Compile installer
        shell: pwsh
        run: |
          $text = Get-Content docs/START-HERE.txt -Raw
          if ($env:SIGN_BUILD -ne 'true') { $text += "`nThis developer build is unsigned.`n" }
          Set-Content build/START-HERE.txt $text -Encoding utf8
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $compiler installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign installer
        if: inputs.sign
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify installer signature and installation
        shell: pwsh
        run: |
          if ($env:SIGN_BUILD -eq 'true') {
            $signature = Get-AuthenticodeSignature dist/Church-Device-Control-Setup.exe
            if ($signature.Status -ne 'Valid') { throw 'Installer signature verification failed' }
            Write-Host "Verified installer publisher: $($signature.SignerCertificate.Subject)"
          }
          foreach ($mode in @('CURRENTUSER','ALLUSERS')) {
            $target = Join-Path $env:RUNNER_TEMP "church-control-$mode"
            $p = Start-Process dist/Church-Device-Control-Setup.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/$mode",'/TASKS=taskbarhelp',"/DIR=$target") -PassThru -Wait
            if ($p.ExitCode -ne 0 -or -not (Test-Path "$target/Church-TV-Control.exe")) { throw "Installation failed: $mode" }
            foreach ($notice in @('LICENSE.txt','THIRD-PARTY-NOTICES.txt')) {
              if (-not (Test-Path "$target/$notice")) { throw "Missing installed notice: $notice ($mode)" }
              $source = if ($notice -eq 'LICENSE.txt') { 'LICENSE' } else { $notice }
              if ((Get-FileHash "$target/$notice").Hash -ne (Get-FileHash $source).Hash) { throw "Installed notice differs from source: $notice ($mode)" }
            }
            $shortcut = "$target/Church Device Control.lnk"
            if (-not (Test-Path $shortcut)) { throw "Taskbar helper shortcut missing: $mode" }
            $shell = New-Object -ComObject WScript.Shell
            if ($shell.CreateShortcut($shortcut).TargetPath -ne "$target\Church-TV-Control.exe") { throw 'Shortcut points to the wrong executable' }
            $helperLine = Get-Content installer/setup.iss | Where-Object { $_ -match '^Filename:.*Tasks: taskbarhelp;' }
            if ($helperLine -notmatch '^Filename: "([^"]+)"') { throw 'Taskbar helper command not found' }
            $explorer = $Matches[1].Replace('{win}', $env:WINDIR).Replace('{sys}', [Environment]::SystemDirectory)
            if (-not (Test-Path $explorer)) { throw "Taskbar helper executable missing: $explorer" }
            Start-Process -FilePath $explorer -ArgumentList "/select,`"$shortcut`"" -ErrorAction Stop
            $p = Start-Process "$target/unins000.exe" -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -PassThru -Wait
            if ($p.ExitCode -ne 0 -or (Test-Path "$target/Church-TV-Control.exe")) { throw "Uninstall failed: $mode" }
          }
      - name: Package executable, installer, notices and checksums
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Church-TV-Control-${{ inputs.release_tag }}
          path: |
            dist/Church-TV-Control.exe
            dist/Church-Device-Control-Setup.exe
            dist/SHA256.txt
            dist/LICENSE.txt
            dist/THIRD-PARTY-NOTICES.txt
            build/table-smoke.png
          if-no-files-found: error
      - name: Publish new release
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/release-$env:RELEASE_TAG.txt"
          gh release create $env:RELEASE_TAG dist/Church-TV-Control.exe dist/Church-Device-Control-Setup.exe dist/SHA256.txt dist/LICENSE.txt dist/THIRD-PARTY-NOTICES.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "$env:RELEASE_TAG — Church Device Control" --notes-file $notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
